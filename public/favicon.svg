<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>

    <linearGradient id="pGrad" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#00f7ff" />
      <stop offset="35%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>

    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f7ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#00d2ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0" />
    </radialGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" stroke="#1e293b" stroke-width="6" fill="none" />

  <!-- Ambient background glow behind the P logo -->
  <circle cx="256" cy="226" r="140" fill="url(#starGlow)" filter="url(#subtleGlow)" />

  <!-- The stylized 'P' speech bubble shape -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M 100 76
       L 322 76
       A 90 90 0 0 1 412 166
       L 412 250
       A 90 90 0 0 1 322 340
       L 264 340
       L 168 436
       L 100 436
       L 100 76
       Z
       M 168 144
       L 298 144
       A 46 46 0 0 1 344 190
       L 344 226
       A 46 46 0 0 1 298 272
       L 264 272
       L 168 368
       L 168 144
       Z"
    fill="url(#pGrad)"
  />

  <!-- Sparkle Star inside the cutout -->
  <path
    d="M 256 154
       C 256 193 222 218 190 218
       C 222 218 256 243 256 282
       C 256 243 290 218 322 218
       C 290 218 256 193 256 154
       Z"
    fill="url(#starGrad)"
  />
</svg>
